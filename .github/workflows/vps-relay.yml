name: VPS relay

on:
  workflow_dispatch:
  push:
    branches: [standard]
    paths: ['push-relay/**', '.github/workflows/vps-relay.yml']

permissions:
  contents: read

concurrency:
  group: vps-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test
        working-directory: push-relay
        run: node test.mjs

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PRO_API_KEY: ${{ secrets.PRO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODERATION_KEY: ${{ secrets.MODERATION_KEY }}
          CRYPTOPAY_TOKEN: ${{ secrets.CRYPTOPAY_TOKEN }}
          TONCENTER_KEY: ${{ secrets.TONCENTER_KEY }}
          XROCKET_TOKEN: ${{ secrets.XROCKET_TOKEN }}
          XROCKET_WEBHOOK_TOKEN: ${{ secrets.XROCKET_WEBHOOK_TOKEN }}
        run: |
          set -eu
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Add VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS to the repository secrets"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          STATS_TOKEN="$(printf 'ayugram-stats\n%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$STATS_TOKEN"
          HOOK_SECRET=""
          if [ -n "$BOT_TOKEN" ]; then
            HOOK_SECRET="$(printf 'ayugram-bot\n%s' "$BOT_TOKEN" | sha256sum | cut -d' ' -f1)"
            echo "::add-mask::$HOOK_SECRET"
          fi
          umask 077
          {
            echo "STATS_TOKEN=$STATS_TOKEN"
            echo "REPORT_CHAT_ID=1272887902"
            [ -n "$BOT_TOKEN" ] && echo "REPORT_BOT_TOKEN=$BOT_TOKEN" && echo "REPORT_WEBHOOK_SECRET=$HOOK_SECRET"
            for name in GROQ_API_KEY PRO_API_KEY GEMINI_API_KEY MODERATION_KEY CRYPTOPAY_TOKEN TONCENTER_KEY XROCKET_TOKEN XROCKET_WEBHOOK_TOKEN; do
              value="$(printenv "$name" || true)"
              [ -n "$value" ] && echo "$name=$value"
            done
            true
          } > relay.env
          tar czf relay.tgz push-relay/*.js push-relay/vps
          scp -q relay.tgz relay.env "ubuntu@$VPS_HOST:/tmp/"
          rm -f relay.env
          ssh "ubuntu@$VPS_HOST" 'set -eu
            sudo install -d -o ubuntu -g ubuntu /opt/ayugram-relay
            tar xzf /tmp/relay.tgz -C /opt/ayugram-relay --strip-components=1
            sudo install -m 600 -o root -g root /tmp/relay.env /etc/ayugram-relay.env
            rm -f /tmp/relay.env /tmp/relay.tgz
            sudo sh /opt/ayugram-relay/vps/install.sh'
          if [ -n "$BOT_TOKEN" ]; then
            RESULT="$(curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" --data-urlencode "url=https://relay.mapixdev.com/tg/hook" --data-urlencode "secret_token=$HOOK_SECRET" --data-urlencode 'allowed_updates=["message","callback_query"]')"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if d.get("ok") else "setWebhook failed: " + str(d.get("description")))' "$RESULT"
          fi
