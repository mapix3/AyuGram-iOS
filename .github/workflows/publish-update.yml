name: Publish update

# Offers a finished build to users: writes update.json, which the app reads to show the
# "Available update" notice. Tapping it hands this build's IPA to the user's installer app.
# Then posts both IPAs with the notes and the release link to the updates channel
# when TELEGRAM_BOT_TOKEN is set.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number to publish (from the build-NNNNNN release)'
        required: true
        type: string
      version:
        description: 'Version shown to users, for example 13.0'
        required: true
        type: string
      notes:
        description: 'What is new, posted to the updates channel'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout standard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: standard
          fetch-depth: 1

      - name: Write update.json
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Build must be a number"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Version must look like 13.0"; exit 1; }
          TAG="build-$BUILD"
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for VARIANT in standard custom; do
            grep -qx "AyuGram-$VARIANT.ipa" <<<"$ASSETS" || { echo "::error::$TAG has no AyuGram-$VARIANT.ipa"; exit 1; }
          done
          python3 - <<'PY'
          import json, os
          base = 'https://github.com/%s/releases/download/build-%s/' % (os.environ['GITHUB_REPOSITORY'], os.environ['BUILD'])
          manifest = {
              'build': int(os.environ['BUILD']),
              'version': '%s (%s)' % (os.environ['VERSION'], os.environ['BUILD']),
              'url': 'https://t.me/ayugramiosupdates',
              'ipa': {variant: base + 'AyuGram-%s.ipa' % variant for variant in ('standard', 'custom')},
          }
          open('update.json', 'w').write(json.dumps(manifest, indent=2) + '\n')
          PY
          cat update.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Commit update.json
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Publish build $BUILD"
          git push origin HEAD:standard

  announce:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHANNEL: '@ayugramiosupdates'
      # The cloud Bot API takes files up to 50 MB; a local server built from Telegram's
      # own tdlib/telegram-bot-api source takes the 85 MB IPAs.
      BOT_API_COMMIT: e3e9dd8e5b3d7ab8537cd5a10dc31d5ffa8f82d1
    steps:
      - name: Check the bot token
        id: token
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TELEGRAM_BOT_TOKEN is not set; the channel post is skipped"
          fi

      - name: Restore the Bot API server
        if: steps.token.outputs.present == 'true'
        id: server
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: bot-api
          key: telegram-bot-api-${{ env.BOT_API_COMMIT }}

      - name: Build the Bot API server
        if: steps.token.outputs.present == 'true' && steps.server.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq make zlib1g-dev libssl-dev gperf cmake g++
          git init -q source
          git -C source fetch -q --depth 1 https://github.com/tdlib/telegram-bot-api "$BOT_API_COMMIT"
          git -C source checkout -q FETCH_HEAD
          git -C source submodule update -q --init --depth 1
          cmake -S source -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/bot-api"
          cmake --build build --target install -j "$(nproc)"

      - name: Post the update to the channel
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUILD: ${{ inputs.build }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          gh release download "build-$BUILD" --repo "$GITHUB_REPOSITORY" --pattern 'AyuGram-*.ipa' --dir ipa
          mkdir -p bot-data bot-temp
          bot-api/bin/telegram-bot-api --api-id="$API_ID" --api-hash="$API_HASH" --local \
            --http-port=8081 --dir="$PWD/bot-data" --temp-dir="$PWD/bot-temp" &
          API="http://127.0.0.1:8081/bot$TOKEN"
          for _ in $(seq 60); do
            curl -sf "$API/getMe" >/dev/null && break
            sleep 2
          done
          check() {
            jq -e '.ok' >/dev/null <<<"$1" || { echo "::error::Telegram refused the post: $(jq -r '.description' <<<"$1")"; exit 1; }
          }
          RELEASE="https://github.com/$GITHUB_REPOSITORY/releases/tag/build-$BUILD"
          TEXT="AyuGram $VERSION ($BUILD)"
          [ -n "$NOTES" ] && TEXT="$TEXT"$'\n\n'"$NOTES"
          TEXT="$TEXT"$'\n\nStandard — обычный AyuGram, Custom — с кастомным оформлением.'
          # The text sits under the files with the release link at the very bottom. A caption
          # holds 1024 characters; longer notes go in a message of their own above the files.
          if [ $(( ${#TEXT} + ${#RELEASE} + 2 )) -le 1024 ]; then
            CAPTION="$TEXT"$'\n\n'"$RELEASE"
          else
            check "$(curl -sS "$API/sendMessage" --data-urlencode "chat_id=$CHANNEL" --data-urlencode "text=$TEXT" --data-urlencode "link_preview_options={\"is_disabled\":true}")"
            CAPTION="$RELEASE"
          fi
          MEDIA="$(jq -cn --arg caption "$CAPTION" '[{type: "document", media: "attach://standard"}, {type: "document", media: "attach://custom", caption: $caption}]')"
          # --form-string: the notes may contain ';' or start with '@', which -F would interpret.
          check "$(curl -sS "$API/sendMediaGroup" --form-string "chat_id=$CHANNEL" --form-string "media=$MEDIA" \
            -F "standard=@ipa/AyuGram-standard.ipa" -F "custom=@ipa/AyuGram-custom.ipa")"
