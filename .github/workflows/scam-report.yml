name: Scam report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The repository is public, and so are its run logs: the report goes to the owner's
      # Telegram as a file and never into the log or the job summary.
      - name: Send the report to the owner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: '1272887902'
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$BOT_TOKEN" ] || { echo "::error::TELEGRAM_BOT_TOKEN is not set"; exit 1; }
          TOKEN="$(printf 'ayugram-stats\n%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$TOKEN"
          curl -sSf -H "Authorization: Bearer $TOKEN" https://ayugram-push.ayugram-status.workers.dev/stats/summary -o summary.json
          python3 ci/ayugram_scam_report.py summary.json > scam-report.md
          RESULT="$(curl -sS "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" -F "chat_id=$OWNER_ID" -F "caption=AyuGram: scam report" -F "document=@scam-report.md")"
          rm -f summary.json scam-report.md
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if d.get("ok") else "Telegram refused the report: " + str(d.get("description")))' "$RESULT"
          echo "The report was sent to the owner in Telegram."
