name = "ayugram-push"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "relay.mapixdev.com", custom_domain = true }
]

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.05

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "Profiles"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Profiles"]
