name = "ayugram-push"
main = "worker.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "Profiles"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Profiles"]
